name = "limo-cafe-bot"
main = "worker.js"
compatibility_date = "2024-09-23"

# اتصال دیتابیس ابری SQLite کلودفلر (Cloudflare D1)
# شناسه database_id پس از اجرای دستور npx wrangler d1 create limo_db جایگزین می‌شود
[[d1_databases]]
binding = "DB"
database_name = "limo_db"
database_id = "00fce5b0-e359-4fdf-a015-a4a225f39d8c"

# زمان‌بندی اجرای کارهای پس‌زمینه (پایش سایت‌ها و شلیک یادآورها هر ۵ دقیقه)
[triggers]
crons = ["*/5 * * * *"]
